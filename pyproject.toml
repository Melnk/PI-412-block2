[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi412-block2"
version = "0.1.0"
description = "IncidentLab and an independent modern RecSys study for KFU SWE block 2"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.28,<1", "langgraph>=1.2.20,<1.3", "psutil>=6,<8",
  "langgraph-checkpoint-sqlite==3.1.3",
  "prometheus-client>=0.21,<1", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
ml = [
  "numpy==1.26.4", "scipy>=1.13,<1.15", "scikit-learn>=1.5,<1.8",
  "torch==2.2.2; platform_system == 'Darwin' and platform_machine == 'x86_64'",
  "torch>=2.6,<3; platform_system != 'Darwin' or platform_machine != 'x86_64'",
]
observability = ["arize-phoenix==22.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
